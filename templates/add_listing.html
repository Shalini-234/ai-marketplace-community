{% extends 'base.html' %}{% block title %}Share a listing · CommunityMarket{% endblock %}{% block content %}<section class="form-shell"><p class="eyebrow">PUT A USEFUL THING IN CIRCULATION</p><h1>Share with your community.</h1><p class="lead">Start with the basics; our AI can help make the listing clearer.</p><form id="listing-form" class="listing-form"><div class="form-wide"><label for="description">Description <span>*</span></label><textarea id="description" required placeholder="Tell neighbours what you have, its condition, and how it can help."></textarea><button type="button" id="enhance-button" class="ai-outline">✨ Enhance with AI</button><div id="enhance-message" class="message hidden"></div></div><div><label for="title">Title <span>*</span></label><input id="title" required></div><div><label for="listing_type">Listing type <span>*</span></label><select id="listing_type" required>{% for t in listing_types %}<option value="{{t}}">{{t|title}}</option>{% endfor %}</select></div><div><label for="category">Category <span>*</span></label><select id="category" required>{% for c in categories %}<option value="{{c}}">{{c|title}}</option>{% endfor %}</select></div><div><label for="price">Price (₹) <span>*</span></label><input id="price" type="number" min="0" required></div><div><label for="location">Location <span>*</span></label><input id="location" required placeholder="e.g. Koramangala"></div><div><label for="condition">Condition <span>*</span></label><input id="condition" required placeholder="e.g. Good"></div><div class="form-wide"><label for="image_url">Image URL <small>(optional)</small></label><input id="image_url" type="url" placeholder="https://..."></div><button class="primary form-submit">Create listing →</button><div id="form-message" class="message hidden"></div></form></section>{% endblock %}
